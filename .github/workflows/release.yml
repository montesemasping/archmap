name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import archmap; print(archmap.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: python tools/build_single.py
      - run: pytest -q
        env:
          ARCHMAP_IMPL: dist
      - name: Checksum
        run: |
          cp dist/archmap.py archmap.py
          sha256sum archmap.py > archmap.py.sha256
          cat archmap.py.sha256
      - name: Release notes from CHANGELOG
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version"; exit 1; }
          printf '\nSHA-256 of `archmap.py`: `%s`\n' "$(cut -d' ' -f1 archmap.py.sha256)" >> notes.md
      - run: gh release create "$GITHUB_REF_NAME" archmap.py archmap.py.sha256 --title "archmap $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
