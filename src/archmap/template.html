<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture map</title>
<style>
:root {
  --bg: #f6f5f1; --bg2: #ecebe5; --panel: #ffffff; --line: #d5d3c9; --text: #1d2321; --dim: #5a625f;
  --accent: #b4600a; --accent-soft: rgba(180, 96, 10, .14); --edge: #9aa19d; --edge-hl: #1f6fa3;
  --flow: #b4600a; --warn: #b3261e; --warn-bg: #fdeceb; --shadow: 0 4px 16px rgba(20, 30, 25, .12);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html[data-theme="dark"] {
  --bg: #12171a; --bg2: #181f23; --panel: #1d262b; --line: #2e3a41; --text: #e4ebe8; --dim: #96a39e;
  --accent: #f0a030; --accent-soft: rgba(240, 160, 48, .16); --edge: #5b6a71; --edge-hl: #6ec1e4;
  --flow: #f0a030; --warn: #ff9b92; --warn-bg: #3a1c1b; --shadow: 0 4px 18px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
a { color: var(--edge-hl); }
#problems { background: var(--warn-bg); color: var(--warn); border-bottom: 2px solid var(--warn); padding: 8px 16px; max-height: 30vh; overflow: auto; flex: none; }
#problems[hidden] { display: none; }
#problems pre { margin: 2px 0 0; white-space: pre-wrap; font: 12.5px/1.4 var(--mono); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--line); flex: none; }
header h1 { font-size: 17px; margin: 0; }
.ctl { display: flex; align-items: center; gap: 6px; }
#search, #flow { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
#search { width: 200px; }
#flow { max-width: 240px; }
#count { color: var(--dim); font-size: 12px; min-width: 60px; }
#layers { display: flex; flex-wrap: wrap; gap: 4px; }
#layers button { border-left-width: 4px; font-size: 12.5px; padding: 2px 8px; }
#layers button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
main { flex: 1; min-height: 0; display: flex; }
#viewport { flex: 1; min-width: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 24px; display: inline-block; }
#edges { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
#cols { display: flex; gap: 90px; align-items: flex-start; }
.col { width: 230px; flex: none; }
.col h2 { font-size: 13px; margin: 0 0 10px; padding: 4px 8px; border-left: 4px solid var(--lc, var(--accent)); background: var(--bg2); border-radius: 0 6px 6px 0; }
.col h2 small { display: block; font-weight: normal; color: var(--dim); font-size: 11.5px; }
.node { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lc, var(--accent)); border-radius: 8px; padding: 6px 8px; margin-bottom: 14px; cursor: pointer; box-shadow: var(--shadow); transition: opacity .12s; }
.node:hover { border-color: var(--accent); }
.node .nl { font-weight: 600; display: block; padding-right: 22px; }
.node .ns { color: var(--dim); font-size: 12px; display: block; margin-top: 2px; }
.node .sn { position: absolute; top: -9px; right: -7px; background: var(--flow); color: #fff; border-radius: 10px; min-width: 20px; padding: 0 5px; font: 700 12px/20px var(--sans); text-align: center; }
.node .sn:empty { display: none; }
.node.dim { opacity: .22; }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.node.nb, .node.match { border-color: var(--edge-hl); }
.node.inflow { border-color: var(--flow); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--dim); margin-right: 4px; }
.badge.status { color: var(--accent); border-color: var(--accent); }
.badge.status-legacy, .badge.status-deprecated, .badge.status-planned { font-style: italic; }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.3; opacity: .55; }
.edge.hl path { stroke: var(--edge-hl); stroke-width: 2.2; opacity: 1; }
.edge.dim { opacity: .15; }
.edge .elabel { font: 11px var(--sans); fill: var(--edge-hl); opacity: 0; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.edge.hl .elabel { opacity: 1; }
.arrow { fill: var(--edge); }
.arrow-hl { fill: var(--edge-hl); }
.arrow-flow { fill: var(--flow); }
#overlay path { fill: none; stroke: var(--flow); stroke-width: 3; stroke-dasharray: 7 4; }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 5; }
aside { width: 380px; max-width: 45vw; flex: none; border-left: 1px solid var(--line); background: var(--bg2); overflow: auto; padding: 10px 14px 30px; }
aside h3 { margin: 0 0 6px; font-size: 15px; }
aside h4 { margin: 10px 0 3px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
aside ul, aside ol { margin: 2px 0; padding-left: 20px; }
aside dl { margin: 2px 0; }
aside dt { font-weight: 600; margin-top: 4px; }
aside dd { margin: 0 0 0 12px; }
aside .hint, .meta { color: var(--dim); }
aside span, aside p { white-space: pre-wrap; overflow-wrap: anywhere; }
.card, aside details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
aside summary { cursor: pointer; font-weight: 600; }
.link-btn { border: 0; background: none; padding: 0; color: var(--edge-hl); text-align: left; }
.link-btn:hover { text-decoration: underline; }
.stepn { display: inline-block; background: var(--flow); color: #fff; border-radius: 9px; min-width: 18px; text-align: center; font-size: 11px; font-weight: 700; margin-right: 4px; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  aside { width: auto; max-width: none; height: 42%; border-left: 0; border-top: 1px solid var(--line); }
  #search { width: 130px; }
}
</style>
</head>
<body>
<div id="problems" hidden></div>
<header>
  <h1 id="title">Architecture map</h1>
  <div class="ctl"><input id="search" type="search" placeholder="Search nodes ( / )" aria-label="Search nodes"><span id="count"></span></div>
  <div class="ctl"><select id="flow" aria-label="Flow"></select></div>
  <div id="layers" aria-label="Layers"></div>
  <div class="ctl"><button id="reset" type="button" title="Reset selection, search and flow (Esc)">Reset</button><button id="theme" type="button">Theme</button></div>
</header>
<main>
  <div id="viewport">
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg" width="0" height="0"></svg>
      <div id="cols"></div>
    </div>
    <div id="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">&minus;</button><button id="zfit" type="button">Fit</button></div>
  </div>
  <aside id="side"><div id="card"></div><div id="flowinfo"></div><div id="panels"></div></aside>
</main>
<script id="archmap-data" type="application/json">/*__ARCHMAP_DATA__*/</script>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function text(v) { return typeof v === "string" || typeof v === "number" ? String(v) : ""; }
  function lc(v) { return text(v).toLowerCase(); }

  function el(tag, content, className) {
    var n = document.createElement(tag);
    if (content !== undefined && content !== null && content !== "") { n.textContent = String(content); }
    if (className) { n.className = className; }
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) { n.setAttribute(k, String(attrs[k])); }
    return n;
  }
  function clear(n) { n.textContent = ""; }
  function cls(n, name, on) { if (n.classList) { n.classList.toggle(name, !!on); } }
  function guarded(parent, name, fn) {
    try { fn(); } catch (err) { parent.appendChild(el("p", "Could not render " + name + ".", "meta")); }
  }

  var payload;
  try { payload = JSON.parse($("archmap-data").textContent); } catch (e) { payload = {}; }
  if (!isObj(payload)) { payload = {}; }

  // Problems banner: first and independent of everything else.
  var box = $("problems");
  guarded(box, "problems", function () {
    var problems = arr(payload.problems);
    if (!problems.length) { return; }
    box.hidden = false;
    box.appendChild(el("strong", problems.length + " problem(s) found by archmap check"));
    problems.forEach(function (line) { box.appendChild(el("pre", text(line))); });
  });

  var map = isObj(payload.map) ? payload.map : {};
  var meta = isObj(map.meta) ? map.meta : {};
  var links = isObj(payload.links) ? payload.links : {};
  var title = text(meta.title) || "Architecture map";
  document.title = title;
  $("title").textContent = title;

  // ---- links -------------------------------------------------------------
  function linkFor(keys) {
    for (var i = 0; i < keys.length; i++) {
      var url = links[keys[i]];
      if (typeof url === "string" && /^https?:\/\//.test(url)) { return url; }
    }
    return null;
  }
  function pathNode(label, keys) {
    var url = linkFor(keys);
    if (!url) { return el("code", label); }
    var a = el("a", label);
    a.href = url;
    a.setAttribute("rel", "noopener noreferrer");
    a.setAttribute("target", "_blank");
    return a;
  }
  function stepRef(step) {
    var hasLine = typeof step.line === "number";
    var label = step.path + (hasLine ? ":" + step.line : "");
    return pathNode(label, hasLine ? [step.path + "#" + step.line, step.path] : [step.path]);
  }

  function renderValue(value, parent, depth) {
    if (depth > 50) { parent.appendChild(el("span", "...")); return; }
    if (Array.isArray(value)) {
      var list = el("ul");
      value.forEach(function (item) { var li = el("li"); renderValue(item, li, depth + 1); list.appendChild(li); });
      parent.appendChild(list);
    } else if (isObj(value)) {
      var dl = el("dl");
      Object.keys(value).forEach(function (key) {
        dl.appendChild(el("dt", key));
        var dd = el("dd");
        renderValue(value[key], dd, depth + 1);
        dl.appendChild(dd);
      });
      parent.appendChild(dl);
    } else if (value !== null && value !== undefined) {
      parent.appendChild(el("span", value));
    }
  }

  // ---- model -------------------------------------------------------------
  var PALETTE = ["#3b8ed0", "#2f9e6b", "#b4600a", "#8e5bc4", "#c44f68", "#a8851c", "#1f9aa3", "#7a8a35"];
  var nodes = [];
  var byId = {};
  arr(map.nodes).forEach(function (n) {
    if (!isObj(n) || !text(n.id) || byId[text(n.id)]) { return; }
    var rec = { id: text(n.id), data: n, label: text(n.label) || text(n.id), layer: text(n.layer) || "(no layer)" };
    var parts = [rec.id, rec.label, n.summary, n.tech, n.kind, n.status, rec.layer].concat(arr(n.files), arr(n.api));
    rec.hay = parts.map(lc).join("\n");
    nodes.push(rec);
    byId[rec.id] = rec;
  });

  var layers = [];
  var layerById = {};
  function addLayer(id, titleText, hint) {
    if (layerById[id]) { return; }
    var rec = { id: id, title: titleText || id, hint: hint || "", color: PALETTE[layers.length % PALETTE.length], visible: true, col: null };
    layers.push(rec);
    layerById[id] = rec;
  }
  arr(meta.layers).forEach(function (l) {
    if (isObj(l) && text(l.id)) { addLayer(text(l.id), text(l.title), text(l.hint)); }
  });
  nodes.forEach(function (n) { addLayer(n.layer, n.layer, ""); });

  var edges = [];
  var edgesOf = {};
  arr(map.edges).forEach(function (e) {
    if (!isObj(e)) { return; }
    var from = text(e.from), to = text(e.to);
    if (!byId[from] || !byId[to]) { return; }
    var rec = { from: from, to: to, label: text(e.label), kind: text(e.kind), g: null, path: null, lab: null };
    edges.push(rec);
    (edgesOf[from] = edgesOf[from] || []).push(rec);
    if (to !== from) { (edgesOf[to] = edgesOf[to] || []).push(rec); }
  });

  var flows = [];
  arr(map.flows).forEach(function (f) {
    if (!isObj(f)) { return; }
    flows.push({ id: text(f.id) || ("flow-" + flows.length), data: f, title: text(f.title) || text(f.id) || "Flow", steps: arr(f.steps).filter(isObj) });
  });

  // ---- state -------------------------------------------------------------
  var state = { sel: null, query: "", flow: null };
  var view = { tx: 0, ty: 0, sc: 1 };
  var dragged = false;
  var world = $("world"), viewport = $("viewport"), edgesSvg = $("edges"), cols = $("cols");
  var overlay = null;

  function visible(n) { var l = layerById[n.layer]; return !l || l.visible; }

  function statusBadge(status) {
    var s = text(status);
    return el("span", s, "badge status status-" + s.toLowerCase().replace(/[^a-z0-9]+/g, "-"));
  }

  // ---- build the graph DOM ----------------------------------------------
  function buildGraph() {
    layers.forEach(function (l) {
      var col = el("div", null, "col");
      col.style.setProperty("--lc", l.color);
      var h = el("h2", l.title);
      if (l.hint) { h.appendChild(el("small", l.hint)); }
      col.appendChild(h);
      l.col = col;
      cols.appendChild(col);
    });
    nodes.forEach(function (n) {
      var b = el("div", null, "node");
      b.setAttribute("role", "button");
      b.setAttribute("tabindex", "0");
      b.setAttribute("data-id", n.id);
      b.appendChild(el("span", n.label, "nl"));
      var sum = text(n.data.summary);
      if (sum) { b.appendChild(el("span", sum.length > 90 ? sum.slice(0, 87) + "..." : sum, "ns")); }
      var tags = el("span", null, "ns");
      var tagCount = 0;
      if (text(n.data.status)) { tags.appendChild(statusBadge(n.data.status)); tagCount++; }
      if (text(n.data.kind)) { tags.appendChild(el("span", n.data.kind, "badge")); tagCount++; }
      if (tagCount) { b.appendChild(tags); }
      n.snum = el("span", null, "sn");
      b.appendChild(n.snum);
      b.addEventListener("click", function (ev) {
        if (ev.stopPropagation) { ev.stopPropagation(); }
        if (dragged) { return; }
        select(n.id === state.sel ? null : n.id, false);
      });
      b.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { if (ev.preventDefault) { ev.preventDefault(); } select(n.id, false); }
      });
      n.box = b;
      var l = layerById[n.layer];
      b.style.setProperty("--lc", l.color);
      l.col.appendChild(b);
    });
    var defs = svg("defs", {});
    ["arrow", "arrow-hl", "arrow-flow"].forEach(function (name) {
      var mk = svg("marker", { id: "m-" + name, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
      mk.appendChild(svg("path", { d: "M0 0L10 5L0 10z", "class": name }));
      defs.appendChild(mk);
    });
    edgesSvg.appendChild(defs);
    edges.forEach(function (e) {
      var g = svg("g", { "class": "edge" });
      var p = svg("path", { "marker-end": "url(#m-arrow)" });
      var tip = svg("title", {});
      tip.textContent = byId[e.from].label + " -> " + byId[e.to].label + (e.label ? ": " + e.label : "");
      g.appendChild(tip);
      g.appendChild(p);
      if (e.label) { e.lab = svg("text", { "class": "elabel" }); e.lab.textContent = e.label; g.appendChild(e.lab); }
      edgesSvg.appendChild(g);
      e.g = g; e.path = p;
    });
    overlay = svg("g", { id: "overlay" });
    edgesSvg.appendChild(overlay);
  }

  // ---- layout: edges are recomputed only when the layout changes ---------
  function rectOf(n) {
    var b = n.box;
    return { x: b.offsetLeft || 0, y: b.offsetTop || 0, w: b.offsetWidth || 0, h: b.offsetHeight || 0 };
  }
  function curve(a, b) {
    var ra = rectOf(a), rb = rectOf(b), x1, x2, d;
    var y1 = ra.y + ra.h / 2, y2 = rb.y + rb.h / 2;
    if (ra.x + ra.w <= rb.x) { x1 = ra.x + ra.w; x2 = rb.x; }
    else if (rb.x + rb.w <= ra.x) { x1 = ra.x; x2 = rb.x + rb.w; }
    else {
      x1 = ra.x + ra.w; x2 = rb.x + rb.w;
      var bulge = Math.max(x1, x2) + 40;
      d = "M" + x1 + " " + y1 + "C" + bulge + " " + y1 + " " + bulge + " " + y2 + " " + x2 + " " + y2;
      return { d: d, mx: bulge - 10, my: (y1 + y2) / 2 };
    }
    var dx = Math.max(30, Math.abs(x2 - x1) / 2) * (x2 >= x1 ? 1 : -1);
    d = "M" + x1 + " " + y1 + "C" + (x1 + dx) + " " + y1 + " " + (x2 - dx) + " " + y2 + " " + x2 + " " + y2;
    return { d: d, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
  }
  var layoutQueued = false;
  function scheduleLayout() {
    if (layoutQueued) { return; }
    layoutQueued = true;
    requestAnimationFrame(function () { layoutQueued = false; layout(); });
  }
  function layout() {
    edgesSvg.setAttribute("width", world.offsetWidth || 0);
    edgesSvg.setAttribute("height", world.offsetHeight || 0);
    edges.forEach(function (e) {
      var a = byId[e.from], b = byId[e.to];
      var ok = a !== b && visible(a) && visible(b);
      e.g.style.display = ok ? "" : "none";
      if (!ok) { return; }
      var c = curve(a, b);
      e.path.setAttribute("d", c.d);
      if (e.lab) { e.lab.setAttribute("x", c.mx); e.lab.setAttribute("y", c.my - 3); }
    });
    drawOverlay();
  }
  function flowNodeIds() {
    var f = currentFlow();
    return f ? f.steps.map(function (s) { return text(s.node); }) : [];
  }
  function drawOverlay() {
    if (!overlay) { return; }
    clear(overlay);
    var ids = flowNodeIds();
    for (var i = 0; i + 1 < ids.length; i++) {
      var a = byId[ids[i]], b = byId[ids[i + 1]];
      if (!a || !b || a === b || !visible(a) || !visible(b)) { continue; }
      overlay.appendChild(svg("path", { d: curve(a, b).d, "marker-end": "url(#m-arrow-flow)" }));
    }
  }

  // ---- state -> classes --------------------------------------------------
  function currentFlow() {
    for (var i = 0; i < flows.length; i++) { if (flows[i].id === state.flow) { return flows[i]; } }
    return null;
  }
  function neighbours(id) {
    var set = {};
    (edgesOf[id] || []).forEach(function (e) { set[e.from] = true; set[e.to] = true; });
    set[id] = true;
    return set;
  }
  function refresh() {
    var q = lc(state.query).trim();
    var flow = currentFlow();
    var focus = null, matches = 0, kind = "";
    if (q) {
      kind = "q"; focus = {};
      nodes.forEach(function (n) { if (visible(n) && n.hay.indexOf(q) !== -1) { focus[n.id] = true; matches++; } });
    } else if (state.sel) {
      kind = "sel"; focus = neighbours(state.sel);
    } else if (flow) {
      kind = "flow"; focus = {};
      flow.steps.forEach(function (s) { focus[text(s.node)] = true; });
    }
    var nums = {};
    if (flow) {
      flow.steps.forEach(function (s, i) { var id = text(s.node); (nums[id] = nums[id] || []).push(i + 1); });
    }
    nodes.forEach(function (n) {
      var inFocus = !focus || focus[n.id];
      cls(n.box, "dim", !inFocus);
      cls(n.box, "sel", state.sel === n.id);
      cls(n.box, "nb", kind === "sel" && inFocus && state.sel !== n.id);
      cls(n.box, "match", kind === "q" && inFocus);
      cls(n.box, "inflow", !!nums[n.id]);
      n.snum.textContent = nums[n.id] ? nums[n.id].join(",") : "";
      n.box.setAttribute("aria-pressed", state.sel === n.id ? "true" : "false");
    });
    var flowEdge = {};
    var ids = flowNodeIds();
    for (var i = 0; i + 1 < ids.length; i++) { flowEdge[ids[i] + ">" + ids[i + 1]] = true; flowEdge[ids[i + 1] + ">" + ids[i]] = true; }
    edges.forEach(function (e) {
      var inFlow = !!flowEdge[e.from + ">" + e.to];
      var hl = (state.sel && (e.from === state.sel || e.to === state.sel)) || inFlow;
      var dim = false;
      if (kind === "q") { dim = !(focus[e.from] && focus[e.to]); }
      else if (kind === "sel") { dim = !hl; }
      else if (kind === "flow") { dim = !inFlow; }
      cls(e.g, "hl", hl);
      cls(e.g, "dim", dim && !hl);
      e.path.setAttribute("marker-end", hl ? "url(#m-arrow-hl)" : "url(#m-arrow)");
    });
    $("count").textContent = q ? matches + " match" + (matches === 1 ? "" : "es") : "";
    drawOverlay();
    renderCard();
    renderFlowInfo();
  }

  function select(id, center) {
    state.sel = id;
    refresh();
    if (id && center) { centerOn(id); }
  }
  function reset() {
    state.sel = null; state.query = ""; state.flow = null;
    $("search").value = "";
    $("flow").value = "";
    refresh();
  }
  function setFlow(id) {
    state.flow = id || null;
    $("flow").value = id || "";
    refresh();
  }

  // ---- side panel: node card ---------------------------------------------
  function edgeItem(id, edge, arrow) {
    var li = el("li");
    var b = el("button", arrow + " " + byId[id].label, "link-btn");
    b.setAttribute("type", "button");
    b.addEventListener("click", function () { select(id, true); });
    li.appendChild(b);
    var extra = [edge.label, edge.kind].filter(Boolean).join(", ");
    if (extra) { li.appendChild(el("span", " (" + extra + ")", "meta")); }
    return li;
  }
  function renderCard() {
    var card = $("card");
    clear(card);
    guarded(card, "node card", function () {
      var n = state.sel ? byId[state.sel] : null;
      if (!n) { card.appendChild(el("p", "Click a node to see its details. Esc resets.", "hint")); return; }
      var d = n.data, wrap = el("div", null, "card");
      wrap.appendChild(el("h3", n.label));
      var tags = el("p");
      tags.appendChild(el("code", n.id));
      tags.appendChild(document.createTextNode(" "));
      if (text(d.status)) { tags.appendChild(statusBadge(d.status)); }
      if (text(d.kind)) { tags.appendChild(el("span", d.kind, "badge")); }
      tags.appendChild(el("span", layerById[n.layer].title, "badge"));
      if (text(d.tech)) { tags.appendChild(el("span", d.tech, "badge")); }
      wrap.appendChild(tags);
      if (text(d.summary)) { wrap.appendChild(el("p", d.summary)); }
      [["Details", d.details], ["API", d.api]].forEach(function (pair) {
        if (pair[1] === undefined || pair[1] === null || pair[1] === "") { return; }
        wrap.appendChild(el("h4", pair[0]));
        renderValue(pair[1], wrap, 0);
      });
      var files = arr(d.files).filter(function (f) { return typeof f === "string"; });
      if (files.length) {
        wrap.appendChild(el("h4", "Files"));
        var ul = el("ul");
        files.forEach(function (f) { var li = el("li"); li.appendChild(pathNode(f, [f])); ul.appendChild(li); });
        wrap.appendChild(ul);
      }
      var all = edgesOf[n.id] || [];
      [["Outgoing", all.filter(function (e) { return e.from === n.id; }), "to", "->"],
       ["Incoming", all.filter(function (e) { return e.to === n.id; }), "from", "<-"]].forEach(function (g) {
        if (!g[1].length) { return; }
        wrap.appendChild(el("h4", g[0] + " (" + g[1].length + ")"));
        var l = el("ul");
        g[1].forEach(function (e) { l.appendChild(edgeItem(e[g[2]], e, g[3])); });
        wrap.appendChild(l);
      });
      var inFlows = flows.filter(function (f) { return f.steps.some(function (s) { return text(s.node) === n.id; }); });
      if (inFlows.length) {
        wrap.appendChild(el("h4", "Used in flows"));
        var fl = el("ul");
        inFlows.forEach(function (f) {
          var li = el("li"), b = el("button", f.title, "link-btn");
          b.setAttribute("type", "button");
          b.addEventListener("click", function () { setFlow(f.id); });
          li.appendChild(b); fl.appendChild(li);
        });
        wrap.appendChild(fl);
      }
      card.appendChild(wrap);
    });
  }

  // ---- side panel: flow --------------------------------------------------
  function renderFlowInfo() {
    var fbox = $("flowinfo");
    clear(fbox);
    guarded(fbox, "flow", function () {
      var f = currentFlow();
      if (!f) { return; }
      var wrap = el("div", null, "card");
      wrap.appendChild(el("h3", "Flow: " + f.title));
      if (text(f.data.summary)) { wrap.appendChild(el("p", f.data.summary)); }
      var tags = arr(f.data.tags).map(text).filter(Boolean);
      if (tags.length) { var tp = el("p"); tags.forEach(function (t) { tp.appendChild(el("span", t, "badge")); }); wrap.appendChild(tp); }
      var ol = el("ol");
      f.steps.forEach(function (s, i) {
        var li = el("li"), id = text(s.node), n = byId[id];
        li.appendChild(el("span", i + 1, "stepn"));
        if (n) {
          var b = el("button", n.label, "link-btn");
          b.setAttribute("type", "button");
          b.addEventListener("click", function () { select(id, true); });
          li.appendChild(b);
        } else { li.appendChild(el("span", id || "(unknown node)", "meta")); }
        if (text(s.note)) { li.appendChild(el("div", s.note)); }
        if (typeof s.path === "string" && s.path) {
          var ref = el("div");
          ref.appendChild(stepRef(s));
          if (text(s.symbol)) { ref.appendChild(el("span", " (" + s.symbol + ")", "meta")); }
          li.appendChild(ref);
        }
        ol.appendChild(li);
      });
      wrap.appendChild(ol);
      fbox.appendChild(wrap);
    });
  }

  // ---- side panel: static info panels ------------------------------------
  function panel(parent, name, titleText, fill) {
    guarded(parent, name, function () {
      var d = el("details");
      d.appendChild(el("summary", titleText));
      var inner = el("div");
      if (fill(inner) === false) { return; }
      d.appendChild(inner);
      parent.appendChild(d);
    });
  }
  function pathLine(item, tag, textKey) {
    var li = el(tag);
    if (typeof item.path === "string" && item.path) { li.appendChild(pathNode(item.path, [item.path])); li.appendChild(document.createTextNode(" ")); }
    li.appendChild(el("span", text(item[textKey])));
    return li;
  }
  function noteList(items, container, listTag, textKeys) {
    var list = el(listTag), count = 0;
    arr(items).forEach(function (it) {
      var li;
      if (typeof it === "string" || typeof it === "number") { li = el("li"); li.appendChild(el("span", it)); }
      else if (isObj(it)) {
        var key = textKeys.filter(function (k) { return text(it[k]); })[0] || textKeys[0];
        li = pathLine(it, "li", key);
      } else { return; }
      list.appendChild(li); count++;
    });
    if (!count) { return false; }
    container.appendChild(list);
  }
  function renderPanels() {
    var host = $("panels");
    panel(host, "overview", "Overview", function (d) {
      var any = false;
      [["Project", meta.project], ["Purpose", meta.purpose], ["Updated", meta.updated_at]].forEach(function (p) {
        if (text(p[1])) { d.appendChild(el("h4", p[0])); d.appendChild(el("p", p[1])); any = true; }
      });
      [["Stack", meta.stack], ["Conventions", meta.conventions], ["Maintenance", meta.maintenance]].forEach(function (p) {
        if (p[1] !== undefined && p[1] !== null && p[1] !== "") { d.appendChild(el("h4", p[0])); renderValue(p[1], d, 0); any = true; }
      });
      return any;
    });
    panel(host, "entrypoints", "Entrypoints", function (d) { return noteList(meta.entrypoints, d, "ul", ["what"]); });
    panel(host, "reading order", "Reading order", function (d) { return noteList(map.reading_order, d, "ol", ["why"]); });
    panel(host, "gotchas", "Gotchas", function (d) { return noteList(map.gotchas, d, "ul", ["text"]); });
    panel(host, "unknowns", "Unknowns", function (d) { return noteList(map.unknowns, d, "ul", ["text"]); });
    if (isObj(map.sections)) {
      Object.keys(map.sections).forEach(function (key) {
        var s = isObj(map.sections[key]) ? map.sections[key] : {};
        panel(host, "section " + key, text(s.title) || key, function (d) {
          var body = s.body !== undefined ? s.body : s.items;
          if (body === undefined || body === null) { return false; }
          renderValue(body, d, 0);
        });
      });
    }
  }

  // ---- header controls ---------------------------------------------------
  function buildControls() {
    var sel = $("flow");
    var none = el("option", "No flow selected");
    none.setAttribute("value", "");
    sel.appendChild(none);
    flows.forEach(function (f) {
      var o = el("option", f.title);
      o.setAttribute("value", f.id);
      sel.appendChild(o);
    });
    sel.disabled = !flows.length;
    sel.addEventListener("change", function () { setFlow(sel.value); });

    $("search").addEventListener("input", function () { state.query = $("search").value; refresh(); });

    var lbox = $("layers");
    layers.forEach(function (l) {
      var b = el("button", l.title);
      b.setAttribute("type", "button");
      b.setAttribute("aria-pressed", "true");
      b.style.setProperty("border-left-color", l.color);
      b.addEventListener("click", function () {
        l.visible = !l.visible;
        b.setAttribute("aria-pressed", l.visible ? "true" : "false");
        l.col.style.display = l.visible ? "" : "none";
        if (state.sel && !visible(byId[state.sel])) { state.sel = null; }
        refresh();
        layout();
      });
      lbox.appendChild(b);
    });

    $("reset").addEventListener("click", reset);
    $("theme").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    });
    $("zin").addEventListener("click", function () { zoomAt(1.25, viewW() / 2, viewH() / 2); });
    $("zout").addEventListener("click", function () { zoomAt(0.8, viewW() / 2, viewH() / 2); });
    $("zfit").addEventListener("click", fit);

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        reset();
        if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
      } else if (ev.key === "/" && document.activeElement !== $("search")) {
        if (ev.preventDefault) { ev.preventDefault(); }
        $("search").focus();
      }
    });
  }

  // ---- pan and zoom ------------------------------------------------------
  function viewW() { return viewport.clientWidth || 0; }
  function viewH() { return viewport.clientHeight || 0; }
  function applyView() {
    world.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.sc + ")";
  }
  function zoomAt(f, cx, cy) {
    var ns = Math.min(2.5, Math.max(0.15, view.sc * f));
    view.tx = cx - (cx - view.tx) * (ns / view.sc);
    view.ty = cy - (cy - view.ty) * (ns / view.sc);
    view.sc = ns;
    applyView();
  }
  function fit() {
    var w = world.offsetWidth || 0, h = world.offsetHeight || 0;
    if (!w || !h || !viewW() || !viewH()) { view.sc = 1; view.tx = 0; view.ty = 0; applyView(); return; }
    view.sc = Math.min(1, viewW() / w, viewH() / h);
    view.tx = Math.max(0, (viewW() - w * view.sc) / 2);
    view.ty = 0;
    applyView();
  }
  function centerOn(id) {
    var n = byId[id];
    if (!n || !viewW()) { return; }
    var r = rectOf(n);
    var x = view.tx + r.x * view.sc, y = view.ty + r.y * view.sc;
    if (x < 0 || y < 0 || x + r.w * view.sc > viewW() || y + r.h * view.sc > viewH()) {
      view.tx = viewW() / 2 - (r.x + r.w / 2) * view.sc;
      view.ty = viewH() / 2 - (r.y + r.h / 2) * view.sc;
      applyView();
    }
  }
  function setupPanZoom() {
    var start = null;
    viewport.addEventListener("pointerdown", function (ev) {
      if (ev.button !== undefined && ev.button !== 0) { return; }
      start = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
      dragged = false;
    });
    window.addEventListener("pointermove", function (ev) {
      if (!start) { return; }
      var dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (!dragged && Math.abs(dx) + Math.abs(dy) < 5) { return; }
      dragged = true;
      cls(viewport, "panning", true);
      view.tx = start.tx + dx; view.ty = start.ty + dy;
      applyView();
    });
    function end() {
      start = null;
      cls(viewport, "panning", false);
      setTimeout(function () { dragged = false; }, 0);
    }
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
    viewport.addEventListener("click", function () { if (!dragged && state.sel) { select(null, false); } });
    viewport.addEventListener("wheel", function (ev) {
      if (ev.preventDefault) { ev.preventDefault(); }
      var r = viewport.getBoundingClientRect();
      zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    window.addEventListener("resize", scheduleLayout);
    if (typeof ResizeObserver === "function") { new ResizeObserver(scheduleLayout).observe(world); }
  }

  // ---- start -------------------------------------------------------------
  var dark = false;
  try { dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) { dark = false; }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

  var cw = $("cols");
  guarded(cw, "graph", buildGraph);
  guarded(cw, "controls", buildControls);
  guarded(cw, "pan and zoom", setupPanZoom);
  guarded($("panels"), "panels", renderPanels);
  guarded(cw, "layout", function () { refresh(); layout(); fit(); });
  requestAnimationFrame(function () { guarded(cw, "layout", function () { layout(); fit(); }); });
})();
</script>
</body>
</html>
